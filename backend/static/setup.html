<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Set up · ChatRaw Server</title>
    <link rel="stylesheet" href="/auth.css">
</head>
<body data-mode="setup">
    <main class="shell">
        <p class="eyebrow">First-run setup</p>
        <h1>Create the administrator.</h1>
        <p class="intro">Use the one-time token stored in the deployment secret file. It becomes permanently invalid after setup.</p>
        <form>
            <label for="setup_token">Setup token</label>
            <input id="setup_token" name="setup_token" type="password" autocomplete="off" required autofocus>
            <label for="username">Administrator username</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required>
            <button type="submit">Create administrator</button>
            <p class="message" role="status" aria-live="polite"></p>
        </form>
    </main>
    <script src="/auth.js" defer></script>
</body>
</html>
