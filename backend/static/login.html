<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title data-i18n="loginTitle">Sign in · ChatRaw Server</title>
    <link rel="stylesheet" href="/auth.css?v=5f5500e673431515f55eca4b2b45d266d20da43fe94a99e77355c8a5d901acfb">
</head>
<body data-mode="login">
    <main class="login-page-shell">
      <section class="login-field" data-i18n-aria-label="loginArtworkLabel">
        <div class="login-field-copy">
          <p data-i18n="loginArtworkEyebrow">ChatRaw / Shared Intelligence</p>
          <h2 data-i18n="loginArtworkHeading">Put complex work in one place.</h2>
          <span data-i18n="loginArtworkCopy">Conversations, knowledge and business modules work together in one clear workspace.</span>
        </div>
      </section>
      <section class="login-panel-wrap" aria-label="登录区域">
       <div class="shell">
        <div class="language-switch" role="group" data-i18n-aria-label="languageSelector">
            <button type="button" class="language-option" data-language="en">English</button>
            <button type="button" class="language-option" data-language="zh">中文</button>
        </div>
        <div class="login-brand"><img id="public-logo" src="/brand-mark.svg" alt=""><div><strong id="public-logo-text">ChatRaw</strong><span data-i18n="sharedWorkspace">Shared workspace</span></div></div>
        <p class="eyebrow" data-i18n="welcomeBack">Welcome back</p>
        <h1 data-i18n="loginHeading">Welcome back.</h1>
        <p class="intro" data-i18n="loginIntro">Sign in to enter the shared workspace. Your administrator manages access.</p>
        <form>
            <label for="username" data-i18n="username">Username</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
            <label for="password" data-i18n="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <div class="login-actions">
              <button type="submit" data-i18n="signIn">Sign in</button>
              <button type="reset" class="login-cancel" data-i18n="cancel">Cancel</button>
            </div>
            <p class="message" role="status" aria-live="polite"></p>
        </form>
       </div>
      </section>
    </main>
    <script src="/auth.js?v=bfc5f682830af3104f9217966d00fe93a5006f0a2b653bc63311c0ce5c5f782d" defer></script>
</body>
</html>
