name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**/*.py'
      - 'backend/requirements.txt'
      - 'backend/static/**'
      - 'backend/contracts/**'
      - 'examples/reference-module/**'
      - 'Plugins/Plugin_market/reference-module-companion/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**/*.py'
      - 'backend/requirements.txt'
      - 'backend/static/**'
      - 'backend/contracts/**'
      - 'examples/reference-module/**'
      - 'Plugins/Plugin_market/reference-module-companion/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docs/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  code-check:
    name: Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt pytest flake8

      - name: Syntax check
        run: python -m compileall -q backend

      - name: Flake8 (critical errors only)
        run: flake8 --select=E9,F63,F7,F82 backend

      - name: Module import test
        run: |
          module_data_dir=$(mktemp -d)
          DATA_DIR="$module_data_dir" CHATRAW_TEST_MODE=1 python -c "from backend.main import app"

      - name: Backend regression suite
        run: ./scripts/run-backend-tests.sh

      - name: T6 source deployment acceptance
        run: ./scripts/run-t6-source-gate.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked frontend build dependencies
        run: npm ci --ignore-scripts

      - name: Verify frontend build artifacts
        run: npm run check:frontend

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: code-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t chatraw:test .

      - name: Real HTTP health smoke test
        run: ./scripts/check-docker-health.sh chatraw:test

      - name: T6 Compose deployment acceptance
        run: ./scripts/run-t6-compose-gate.sh
